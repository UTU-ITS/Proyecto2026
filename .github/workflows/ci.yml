name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------
  # Backend — Laravel · TDD con PHPUnit + estilo de código con Pint
  # ---------------------------------------------------------------------
  backend-tests:
    name: Backend · Tests (TDD)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - name: ¿Ya hay un proyecto Laravel en backend/?
        id: laravel
        run: |
          if [ -f composer.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No hay composer.json en backend/ todavía. Corré 'composer create-project laravel/laravel .' dentro de backend/ y este job va a empezar a correr tests de verdad."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP
        if: steps.laravel.outputs.exists == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, bcmath, gd, zip, intl
          coverage: none

      - name: Cache de dependencias de Composer
        if: steps.laravel.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: composer install
        if: steps.laravel.outputs.exists == 'true'
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Preparar .env y key de la app
        if: steps.laravel.outputs.exists == 'true'
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migraciones (base de datos de test)
        if: steps.laravel.outputs.exists == 'true'
        run: php artisan migrate --force

      - name: Estilo de código (Laravel Pint)
        if: steps.laravel.outputs.exists == 'true'
        run: vendor/bin/pint --test

      - name: Tests — ciclo TDD (PHPUnit / Pest)
        if: steps.laravel.outputs.exists == 'true'
        run: php artisan test

  # ---------------------------------------------------------------------
  # Frontend — lint + build (framework a elección de cada equipo)
  # ---------------------------------------------------------------------
  frontend-build:
    name: Frontend · Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: ¿Ya hay un proyecto frontend en frontend/?
        id: frontend
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No hay package.json en frontend/ todavía."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        if: steps.frontend.outputs.exists == 'true'
        run: npm ci

      - name: Lint
        if: steps.frontend.outputs.exists == 'true'
        run: npm run lint --if-present

      - name: Build
        if: steps.frontend.outputs.exists == 'true'
        run: npm run build --if-present

  # ---------------------------------------------------------------------
  # Docker — valida que las imágenes de la stack completa buildeen
  # ---------------------------------------------------------------------
  docker-build:
    name: Docker · Build de imágenes
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: docker compose build
        run: docker compose build
